# Análisis de calidad con SonarQube (local en Docker) o SonarQube Cloud. Ver docs/pruebas.md.
sonar.projectKey=educontrol
sonar.projectName=EduControl
sonar.sourceEncoding=UTF-8

# Código propio: el backend PHP y la app mobile (TypeScript). Las vistas Blade y las dependencias quedan afuera.
sonar.sources=app,routes,database,public/css,mobile/app,mobile/src
sonar.tests=tests,mobile/__tests__
sonar.exclusions=vendor/**,node_modules/**,storage/**,bootstrap/cache/**,mobile/node_modules/**,mobile/.expo/**,mobile/coverage/**
# Migraciones, seeders y rutas son configuración: se analizan, pero no cuentan para la cobertura.
sonar.coverage.exclusions=database/**,routes/**

# Reportes que genera PHPUnit en el CI (artefacto reportes-tests-<commit>).
sonar.php.coverage.reportPaths=reportes/clover.xml
sonar.php.tests.reportPath=reportes/junit.xml

# Cobertura de la app que genera Jest (npm run test:ci en mobile/, artefacto cobertura-mobile-<commit>).
sonar.javascript.lcov.reportPaths=mobile/coverage/lcov.info
