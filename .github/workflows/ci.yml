# Pipeline de integración continua de EduControl.
# Etapas: Build (validar + dependencias) → Seguridad (composer audit) → Lint (Pint) → Test (PHPUnit + cobertura)
#         y, en paralelo, E2E (Selenium sobre la app levantada)
#         → Package + Verify (solo en main) → Verify de producción (si hay URL cargada) → Notify (issue si falla main).
# Explicación completa en docs/ci-cd.md.
name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      simular_fallo:
        description: 'Forzar un fallo para demostrar la notificación (abre un issue de no conformidad)'
        type: boolean
        default: false

# El token del pipeline solo puede leer el código; el job de notificación pide además permiso para issues.
permissions:
  contents: read

# Si llega un push nuevo a la misma rama, se cancela la corrida anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.3'
  PHP_EXTENSIONS: mbstring, pdo_sqlite, sqlite3, zip, gd, intl, bcmath

jobs:
  pruebas:
    name: Build, lint y tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar PHP ${{ env.PHP_VERSION }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: pcov
          tools: composer:v2

      - name: Ubicar la caché de Composer
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Restaurar la caché de Composer
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Build - validar composer.json y composer.lock
        run: composer validate --no-interaction

      - name: Build - instalar dependencias
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Seguridad - vulnerabilidades conocidas en las dependencias
        run: composer audit --no-interaction

      - name: Preparar el entorno (.env y APP_KEY)
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Lint - estilo de código con Pint
        run: vendor/bin/pint --test

      - name: Simular un fallo (solo en la demostración manual)
        if: github.event_name == 'workflow_dispatch' && inputs.simular_fallo
        run: |
          echo "::error::Fallo simulado para demostrar la notificación"
          exit 1

      - name: Test - PHPUnit con cobertura
        run: |
          mkdir -p reportes
          vendor/bin/phpunit --colors=never \
            --log-junit reportes/junit.xml \
            --coverage-clover reportes/clover.xml \
            --coverage-html reportes/cobertura \
            --coverage-text=reportes/cobertura.txt

      - name: Resumen en la página de la corrida
        if: always()
        run: |
          {
            echo "## Resultado de los tests"
            if [ -f reportes/junit.xml ]; then
              grep -m1 -o 'tests="[0-9]*" assertions="[0-9]*" errors="[0-9]*" failures="[0-9]*" skipped="[0-9]*" time="[0-9.]*"' reportes/junit.xml
            fi
            echo
            echo "## Cobertura"
            echo '```'
            [ -f reportes/cobertura.txt ] && grep -A4 'Summary' reportes/cobertura.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar reportes de tests y cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reportes-tests-${{ github.sha }}
          path: reportes/
          retention-days: 14

  # Pruebas de navegador (caso de prueba CP-TR-01 y regresiones) con Selenium sobre Chrome.
  e2e:
    name: E2E - pruebas de navegador con Selenium
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DB_CONNECTION: sqlite
      DB_DATABASE: ${{ github.workspace }}/database/e2e.sqlite
      E2E_NAVEGADOR: chrome

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar PHP ${{ env.PHP_VERSION }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          npm ci

      - name: Levantar la aplicación con los datos de prueba
        run: |
          cp .env.example .env
          php artisan key:generate
          touch "$DB_DATABASE"
          php artisan migrate:fresh --seed --force
          php artisan serve --host=127.0.0.1 --port=8000 > serve.log 2>&1 &
          for intento in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/up > /dev/null && exit 0
            sleep 1
          done
          cat serve.log
          exit 1

      - name: E2E - Selenium
        run: npm run test:e2e

  paquete:
    name: Package - paquete desplegable
    needs: [pruebas, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar PHP ${{ env.PHP_VERSION }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2

      - name: Armar el paquete sin tests ni dependencias de desarrollo
        run: |
          mkdir -p dist/educontrol
          git archive HEAD | tar -x -C dist/educontrol
          cd dist/educontrol
          rm -rf tests phpunit.xml
          composer install --no-dev --optimize-autoloader --no-interaction --no-progress --prefer-dist --no-scripts
          cd ..
          zip -qr "educontrol-${GITHUB_SHA::7}.zip" educontrol

      - name: Verify - comprobar el contenido del paquete
        run: |
          listado=$(unzip -Z1 dist/*.zip)
          problemas=0
          for requerido in educontrol/artisan educontrol/composer.json educontrol/public/index.php educontrol/vendor/autoload.php; do
            if ! echo "$listado" | grep -qx "$requerido"; then
              echo "::error::Falta $requerido en el paquete"
              problemas=1
            fi
          done
          for prohibido in '^educontrol/\.env$' '^educontrol/tests/' '^educontrol/phpunit\.xml$' '^educontrol/vendor/phpunit/'; do
            if echo "$listado" | grep -qE "$prohibido"; then
              echo "::error::El paquete incluye archivos que no deben ir ($prohibido)"
              problemas=1
            fi
          done
          if [ "$problemas" -eq 0 ]; then
            echo "Paquete verificado: $(echo "$listado" | wc -l) entradas, sin .env, sin tests y sin dependencias de desarrollo."
          fi
          exit "$problemas"

      - name: Guardar el paquete como artefacto
        uses: actions/upload-artifact@v7
        with:
          name: educontrol-${{ github.sha }}
          path: dist/*.zip
          retention-days: 30

  # Se activa solo cuando se carga la variable de repositorio URL_PRODUCCION
  # (Settings → Secrets and variables → Actions → Variables). Ver docs/ci-cd.md.
  verificar-produccion:
    name: Verify - la aplicación en producción responde
    needs: paquete
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.URL_PRODUCCION != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Esperar la respuesta 200 de /up
        env:
          URL: ${{ vars.URL_PRODUCCION }}
        run: |
          for intento in $(seq 1 20); do
            codigo=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "${URL%/}/up" || true)
            echo "Intento $intento: HTTP $codigo"
            if [ "$codigo" = "200" ]; then
              exit 0
            fi
            sleep 15
          done
          echo "::error::La aplicación no respondió 200 en ${URL%/}/up"
          exit 1

  notificar:
    name: Notify - registrar la falla como no conformidad
    needs: [pruebas, e2e, paquete, verificar-produccion]
    if: always() && contains(needs.*.result, 'failure') && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write

    steps:
      - name: Abrir el issue de no conformidad
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CORRIDA: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RAMA: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          AUTOR: ${{ github.actor }}
        run: |
          gh label create no-conformidad --color B60205 --description "Incumplimiento de un estándar o proceso del proyecto" 2>/dev/null || true
          {
            echo "El pipeline falló y no se cumple el estándar \"CI en verde\" de CONTRIBUTING.md."
            echo
            echo "- **Rama:** \`${RAMA}\`"
            echo "- **Commit:** \`${COMMIT}\`"
            echo "- **Disparado por:** @${AUTOR}"
            echo "- **Corrida:** ${CORRIDA}"
            echo
            echo "Acción correctiva: revisar el log de la corrida, corregir y volver a correr el CI. Cerrar este issue cuando \`main\` vuelva a estar en verde."
          } > cuerpo.md
          gh issue create --title "CI fallido en ${RAMA} (${COMMIT::7})" --label no-conformidad --body-file cuerpo.md
