# Pipeline de la app mobile (mobile/, Expo + React Native).
# Etapas: Build (npm ci) → Lint (ESLint) → Tipos (TypeScript) → Test (Jest + cobertura) → Bundle (expo export).
# Corre solo cuando cambia algo de la app, así los PR del backend no esperan este job.
# Explicación completa en docs/ci-cd.md.
name: Mobile

on:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'
  pull_request:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App - lint, tipos, tests y bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Build - instalar dependencias
        run: npm ci --no-audit --no-fund

      - name: Lint - ESLint
        run: npm run lint

      - name: Tipos - TypeScript
        run: npm run typecheck

      - name: Test - Jest con cobertura
        run: npm run test:ci

      - name: Bundle - compilar la app para Android
        env:
          EXPO_PUBLIC_API_URL: https://educontrol-5btq.onrender.com/api/v1
        run: npx expo export --platform android --output-dir dist

      - name: Resumen en la página de la corrida
        if: always()
        run: |
          {
            echo "## Cobertura de la app"
            echo '```'
            [ -f coverage/coverage-summary.json ] && node -e "const t=require('./coverage/coverage-summary.json').total; for (const k of ['lines','statements','functions','branches']) console.log(k.padEnd(11), t[k].pct + ' %')"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar la cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-mobile-${{ github.sha }}
          path: mobile/coverage/
          retention-days: 14
          if-no-files-found: ignore
